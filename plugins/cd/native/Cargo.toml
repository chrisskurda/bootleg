[package]
name = "bootleg-plugin-cd"
version = "0.1.0"
description = "bootleg CD plugin: secure audio CD reading, AccurateRip verification, FLAC output (plugin spec 2.0)"
license = "MIT"
edition = "2021"
publish = false
links = "bootleg-cd"

[features]
# The Tauri glue (commands, jobs). The engine and backends build and test without it.
tauri = ["dep:tauri", "dep:bootleg-plugin-api", "dep:ureq", "dep:tauri-plugin"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"
base64 = "0.22"
crc32fast = "1"
flacenc = "0.5"
claxon = "0.4"
lofty = "0.22"
tauri = { version = "2", optional = true }
bootleg-plugin-api = { path = "../../../src-tauri/plugin-api", optional = true }
ureq = { version = "2", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"], optional = true }
