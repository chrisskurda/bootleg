[package]
name = "bootleg-sync"
# explicit (not workspace-inherited) so bootleg can vendor this folder with git subtree
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "bootleg device format 1: mark, pair and safely sync portable players and SD cards (contracts/device_format.md)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
