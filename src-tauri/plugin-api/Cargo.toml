[package]
name = "bootleg-plugin-api"
version = "2.0.0"
description = "What bootleg's core gives native plugins (plugin spec 2.0 §5.3): the spec version, cancellable jobs and secrets."
license = "MIT"
edition = "2021"
publish = false

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring-core = "1.1"

# Secrets in the OS credential store (src/secrets.rs, docs/SECRETS.md)
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }
[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0", features = ["crypto-rust"] }
