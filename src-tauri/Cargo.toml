[package]
name = "bootleg"
version = "0.4.0"
description = "bootleg — a music player with stem mixing, notes and live visualizers."
license = "MIT"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tiny_http = "0.12"
base64 = "0.22"
lofty = "0.22"
ureq = { version = "2", default-features = false }

[profile.release]
opt-level = "s"
lto = true
strip = true
