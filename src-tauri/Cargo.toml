[package]
name = "bootleg"
version = "0.6.0"
description = "bootleg — a music player with stem mixing, notes and live visualizers."
license = "MIT"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tiny_http = "0.12"
base64 = "0.22"
lofty = "0.22"
ureq = { version = "2", default-features = false }
bootleg-plugin-api = { path = "plugin-api" }
bootleg-sync = { path = "../vendor/bootleg-sync" }
toml = "1"
# Native plugins (docs/PLUGIN-SPEC.md §5.1): compiled in behind a `plugin-<id>` feature; first-party ones are on by default.
bootleg-plugin-cd = { path = "../plugins/cd/native", features = ["tauri"], optional = true }
bootleg-plugin-checker = { path = "../plugins/checker/native", features = ["tauri"], optional = true }
bootleg-plugin-acoustid = { path = "../plugins/acoustid/native", features = ["tauri"], optional = true }
bootleg-plugin-capture = { path = "../plugins/capture/native", features = ["tauri"], optional = true }

[features]
default = ["plugin-cd", "plugin-checker", "plugin-acoustid", "plugin-capture"]
plugin-cd = ["dep:bootleg-plugin-cd"]
plugin-checker = ["dep:bootleg-plugin-checker"]
plugin-acoustid = ["dep:bootleg-plugin-acoustid"]
plugin-capture = ["dep:bootleg-plugin-capture"]

[profile.release]
opt-level = "s"
lto = true
strip = true
