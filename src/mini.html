<!doctype html>
<html lang="en">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bootleg mini</title>
<style>
  /* The mini player: the Car Thing app's Now page (bootleg-bridge-thing), drawn at its 800×480 size and scaled to the window. */
  :root { color-scheme: dark; --bg:#0d0f17; --panel:#151925; --panel2:#1b2030; --hover:#232a3f; --line:#272d42; --ink:#e7eaf6; --muted:#8b93b0; --faint:#5d6585; --accent:#7c8cff; --on:#1d2342; --ok:#46d39a; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 16px system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  #stage { position: absolute; left: 0; top: 0; width: 800px; height: 480px; transform-origin: 0 0; }
  .top { height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; -webkit-app-region: drag; }
  .top button, .top .pill { -webkit-app-region: no-drag; }
  .wordmark { font-size: 18px; letter-spacing: .025em; } .wordmark b { color: var(--accent); }
  .pills { display: flex; gap: 8px; } .pill { border-radius: 99px; background: var(--panel2); padding: 4px 12px; font-size: 14px; color: var(--muted); } .pill.ok { color: var(--ok); }
  .now { display: flex; gap: 24px; height: 440px; padding: 8px 20px 0; }
  .left { width: 248px; flex: none; display: flex; flex-direction: column; gap: 10px; }
  .art { width: 248px; height: 248px; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: linear-gradient(135deg, var(--on), #2a1b4a); padding: 0; display: grid; place-items: center; font-size: 60px; color: var(--faint); }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { height: 64px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); font-size: 18px; transition: transform .1s; }
  .btn:hover { background: var(--hover); } .btn:active { transform: scale(.95); } .btn.on { border-color: #3a4590; background: var(--on); color: var(--accent); } .btn.off { opacity: .4; }
  .right { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; padding-bottom: 12px; }
  .meta { min-height: 118px; }
  .title { font-size: 30px; line-height: 1.15; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .artist { margin-top: 4px; font-size: 20px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .album { font-size: 15px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .idle { padding-top: 24px; font-size: 24px; color: var(--muted); }
  .slider { position: relative; height: 56px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
  .slider .trk { height: 12px; width: 100%; border-radius: 99px; background: var(--panel2); overflow: hidden; } .slider .fill { height: 100%; border-radius: 99px; background: var(--accent); width: 0; }
  .slider .knob { position: absolute; width: 28px; height: 28px; margin-left: -14px; border-radius: 50%; border: 2px solid var(--bg); background: var(--ink); left: 0; }
  .times { margin-top: -4px; display: flex; justify-content: space-between; font: 14px var(--mono); color: var(--muted); } .times .pills .pill { font-family: system-ui, sans-serif; }
  .row { display: flex; align-items: center; gap: 12px; }
  .big { height: 96px; flex: 1; } .play { height: 96px; flex: 1.5; display: grid; place-items: center; border-radius: 16px; border: 0; background: var(--accent); color: var(--bg); transition: transform .1s; } .play:active { transform: scale(.95); }
  .vol .btn { width: 64px; } .vol .slider { flex: 1; min-width: 0; } .vol .n { width: 48px; text-align: right; font-family: var(--mono); color: var(--muted); }
  [hidden] { display: none !important; }
  .wait { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 48px; background: var(--bg); } .wait .wordmark { font-size: 48px; } .wait .msg { margin-top: 16px; font-size: 24px; color: var(--muted); }
</style>
</head>
<body>
<div id="stage">
  <div class="top"><div class="wordmark">boot<b>leg</b></div><div class="pills"><span id="pos" class="pill" hidden></span><span id="stemsPill" class="pill" hidden></span><span class="pill ok">● mini</span></div></div>
  <div class="now">
    <div class="left">
      <button id="art" class="art" title="Open bootleg">♪</button>
      <div class="grid2">
        <button id="shuffle" class="btn" title="Shuffle"></button>
        <button id="repeat" class="btn" title="Repeat"></button>
        <button id="open" class="btn" title="Open the bootleg window"></button>
        <button id="pin" class="btn" title="Keep the mini player above other windows"></button>
      </div>
    </div>
    <div class="right">
      <div id="meta" class="meta"></div>
      <div>
        <div id="seek" class="slider" aria-label="Seek"><div class="trk"><div class="fill"></div></div><div class="knob"></div></div>
        <div class="times"><span id="cur">0:00</span><span id="tags" class="pills"></span><span id="dur">0:00</span></div>
      </div>
      <div class="row"><button id="prev" class="btn big" aria-label="Previous"></button><button id="play" class="play" aria-label="Play"></button><button id="next" class="btn big" aria-label="Next"></button></div>
      <div class="row vol"><button id="vdown" class="btn" aria-label="Quieter"></button><div id="vol" class="slider" aria-label="Volume"><div class="trk"><div class="fill"></div></div><div class="knob"></div></div><button id="vup" class="btn" aria-label="Louder"></button><span id="vn" class="n"></span></div>
    </div>
  </div>
  <div id="wait" class="wait"><div><div class="wordmark">boot<b>leg</b></div><div class="msg">Waiting for the player…</div></div></div>
</div>
<script type="module" src="/mini.js"></script>
</body>
</html>
