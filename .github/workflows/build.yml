# Builds and tests bootleg on every push and pull request, and attaches desktop builds as downloadable artifacts.
# Runs on GitHub Actions; Gitea / Forgejo Actions can run the same file (point their runners at the labels below).
name: build
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (web app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - name: Tests (tags, notes, nfo, libraries, browser end-to-end)
        run: npm test
      - name: Performance budget (20,000 tracks, CPU throttled 4×)
        run: npm run perf
      - name: Browser screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: test-failure-shots, path: cache/shots, if-no-files-found: ignore }

  desktop:
    name: desktop (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest, bundles: app, out: 'src-tauri/target/release/bundle/macos/*.app', bin: 'src-tauri/target/release/bundle/macos/bootleg.app/Contents/MacOS/bootleg' }
          - { name: Linux x64, os: ubuntu-22.04, bundles: 'deb,appimage', out: "src-tauri/target/release/bundle/deb/*.deb\nsrc-tauri/target/release/bundle/appimage/*.AppImage", bin: 'src-tauri/target/release/bootleg' }
          - { name: Windows x64, os: windows-latest, bundles: nsis, out: 'src-tauri/target/release/bundle/nsis/*.exe', bin: 'src-tauri/target/release/bootleg.exe' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev xvfb dbus-x11 ffmpeg \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - name: macOS packages
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Windows packages
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: npm ci
      - name: Build the app
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Native plugin tests (CD engine against its simulator; every OS must compile — plugin spec §5.2)
        run: cargo test --manifest-path plugins/cd/native/Cargo.toml
      - name: Library checker tests (decoding, spectrum, AccurateRip on generated files; the ffmpeg-made fakes where ffmpeg is installed)
        run: cargo test --manifest-path plugins/checker/native/Cargo.toml
      - name: Capture tests (click removal, track splits, a whole side recorded from the simulated input and saved)
        run: cargo test --manifest-path plugins/capture/native/Cargo.toml
      - name: AcoustID fingerprint tests
        run: cargo test --manifest-path plugins/acoustid/native/Cargo.toml
      - name: Plugin API tests (jobs, secrets)
        run: cargo test --manifest-path src-tauri/plugin-api/Cargo.toml
      - name: Self-test the built app (scan, tags, playback, stems, cache, notes, Subsonic)
        shell: bash
        continue-on-error: ${{ runner.os == 'Windows' }}      # new on Windows: reported, not yet blocking a release
        env:
          # macOS runners have no user to click Play: WebKit blocks autoplay there, so the playback checks are skipped (still covered on Linux and locally)
          SELFTEST_ALLOW_NO_AUTOPLAY: ${{ runner.os == 'macOS' && '1' || '' }}
        run: scripts/selftest.sh ${{ matrix.bin }}
      - name: Name the artifacts after the commit
        id: ver
        shell: bash
        run: echo "id=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: bootleg-${{ runner.os }}-${{ runner.arch }}-${{ steps.ver.outputs.id }}
          path: ${{ matrix.out }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: attach builds to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist-artifacts }
      - run: cd dist-artifacts && for d in */; do (cd "$d" && zip -qr "../${d%/}.zip" .); done
      - uses: softprops/action-gh-release@v2
        with: { files: dist-artifacts/*.zip, generate_release_notes: true }
